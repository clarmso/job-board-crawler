<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>New Jobs — Job Board Crawler</title>
<style>
  :root {
    --border: #e2e2e2;
    --muted: #6b7280;
    --accent: #2563eb;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    color: #111827;
    background: var(--bg);
  }
  header h1 {
    margin: 0 0 0.25rem;
    font-size: 1.75rem;
  }
  #meta {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  #toc {
    background: #f9fafb;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
  }
  #toc h2 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin: 0 0 0.5rem;
  }
  #toc ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 0.75rem;
  }
  #toc a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.95rem;
  }
  #toc a:hover { text-decoration: underline; }
  .company {
    margin-bottom: 2rem;
    scroll-margin-top: 1rem;
  }
  .company h2 {
    font-size: 1.2rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.4rem;
    margin-bottom: 0.6rem;
  }
  .company h2 .count {
    color: var(--muted);
    font-weight: normal;
    font-size: 0.9rem;
  }
  .company ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .company li {
    padding: 0.4rem 0;
    border-bottom: 1px dashed var(--border);
  }
  .company li:last-child { border-bottom: none; }
  .company a {
    color: #111827;
    text-decoration: none;
  }
  .company a:hover { color: var(--accent); text-decoration: underline; }
  #empty, #error {
    color: var(--muted);
    padding: 2rem 0;
  }
  a.top {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: var(--accent);
    color: #fff;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    text-decoration: none;
    font-size: 0.85rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>
  <header id="top">
    <h1>New Jobs</h1>
    <div id="meta">Loading…</div>
  </header>

  <nav id="toc" hidden>
    <h2>Jump to company</h2>
    <ul id="toc-list"></ul>
  </nav>

  <main id="results"></main>

  <a class="top" href="#top">↑ Top</a>

<script>
async function loadJobs() {
  const meta = document.getElementById("meta");
  const results = document.getElementById("results");
  const toc = document.getElementById("toc");
  const tocList = document.getElementById("toc-list");

  try {
    const res = await fetch("new_jobs.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const generated = new Date(data.generated_at);
    meta.textContent = `Jobs posted in the last 24 hours (as of ${generated.toLocaleString()}) · ${data.total_new_jobs} new job${data.total_new_jobs === 1 ? "" : "s"} across ${data.companies.length} compan${data.companies.length === 1 ? "y" : "ies"}`;

    if (!data.companies.length) {
      results.innerHTML = '<p id="empty">No new jobs in the most recent crawl. Check back soon!</p>';
      return;
    }

    toc.hidden = false;
    const tocFrag = document.createDocumentFragment();
    const resultsFrag = document.createDocumentFragment();

    for (const company of data.companies) {
      const anchorId = `company-${company.slug}`;

      const tocItem = document.createElement("li");
      const tocLink = document.createElement("a");
      tocLink.href = `#${anchorId}`;
      tocLink.textContent = `${company.name} (${company.jobs.length})`;
      tocItem.appendChild(tocLink);
      tocFrag.appendChild(tocItem);

      const section = document.createElement("section");
      section.className = "company";
      section.id = anchorId;

      const heading = document.createElement("h2");
      heading.textContent = company.name + " ";
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = `(${company.jobs.length})`;
      heading.appendChild(count);
      section.appendChild(heading);

      const list = document.createElement("ul");
      for (const job of company.jobs) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = job.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = job.title;
        li.appendChild(a);
        list.appendChild(li);
      }
      section.appendChild(list);
      resultsFrag.appendChild(section);
    }

    tocList.appendChild(tocFrag);
    results.appendChild(resultsFrag);
  } catch (err) {
    meta.textContent = "";
    results.innerHTML = `<p id="error">Couldn't load job data: ${err.message}</p>`;
  }
}

loadJobs();
</script>
</body>
</html>
