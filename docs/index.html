<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>New Jobs — Job Board Crawler</title>
<style>
  :root {
    --border: #e2e2e2;
    --muted: #6b7280;
    --accent: #2563eb;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    color: #111827;
    background: var(--bg);
  }
  header h1 {
    margin: 0 0 0.25rem;
    font-size: 1.75rem;
  }
  #meta {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  #toc {
    background: #f9fafb;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
  }
  #toc h2 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin: 0 0 0.5rem;
  }
  #toc ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 0.75rem;
  }
  #toc a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.95rem;
  }
  #toc a:hover { text-decoration: underline; }
  .company {
    margin-bottom: 2rem;
    scroll-margin-top: 1rem;
  }
  .company h2 {
    font-size: 1.2rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.4rem;
    margin-bottom: 0.6rem;
  }
  .company h2 .count {
    color: var(--muted);
    font-weight: normal;
    font-size: 0.9rem;
  }
  .company ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .company li {
    padding: 0.4rem 0;
    border-bottom: 1px dashed var(--border);
  }
  .company li:last-child { border-bottom: none; }
  .company a {
    color: #111827;
    text-decoration: none;
  }
  .company a:hover { color: var(--accent); text-decoration: underline; }
  .job-meta {
    color: var(--muted);
    font-size: 0.85rem;
    margin-left: 0.5rem;
    white-space: nowrap;
  }
  .job-mode {
    display: inline-block;
    margin-left: 0.4rem;
    padding: 0.05rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 0.75rem;
  }
  .job-mode.remote { color: #047857; border-color: #a7f3d0; background: #ecfdf5; }
  .job-mode.hybrid { color: #b45309; border-color: #fde68a; background: #fffbeb; }
  .job-mode.on-site { color: #4338ca; border-color: #c7d2fe; background: #eef2ff; }
  #empty {
    color: var(--muted);
    padding: 2rem 0;
  }
  a.top {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: var(--accent);
    color: #fff;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    text-decoration: none;
    font-size: 0.85rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>
  <header id="top">
    <h1>New Jobs</h1>
    <div id="meta">Jobs posted in the last 24 hours (as of 2026-09-19 23:43 UTC) &middot; 0 new jobs across 0 companies</div>
  </header>


  <main id="results">
    <p id="empty">No new jobs in the most recent crawl. Check back soon!</p>
  </main>

  <a class="top" href="#top">↑ Top</a>
</body>
</html>
