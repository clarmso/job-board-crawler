name: Crawl Job Boards

on:
  schedule:
      # 03:00 UTC Tue-Sat = 8:00 PM Mon-Fri Pacific (PDT) / 7:00 PM (PST).
      # GitHub Actions cron is always UTC and doesn't shift for daylight
      # saving, so day-of-week is Tue-Sat (2-6) to land on Mon-Fri Pacific.
      - cron: '0 3 * * 2-6'
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run crawler
        run: python crawl.py

      - name: Generate new jobs manifest
        if: always()
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: python scripts/generate_new_jobs.py

      - name: Generate companies page
        if: always()
        run: python scripts/generate_companies_page.py

      - name: Commit changes
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ state/ docs/new_jobs.json docs/index.html docs/companies.json docs/companies.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🦀 crawl: $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A GITHUB_TOKEN-authenticated push above does NOT trigger other
      # workflows' `on: push` (GitHub's loop-prevention rule), so Deploy
      # Pages must be dispatched explicitly here when docs/ changed.
      - name: Trigger Pages deployment
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main