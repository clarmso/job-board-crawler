name: Crawl Job Boards

on:
  schedule:
      # 02:00 UTC Tue-Sat = 7:00 PM Mon-Fri Pacific (PDT) / 6:00 PM (PST).
      # GitHub Actions cron is always UTC and doesn't shift for daylight
      # saving, so day-of-week is Tue-Sat (2-6) to land on Mon-Fri Pacific.
      - cron: '0 2 * * 2-6'
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run crawler
        run: python crawl.py

      - name: Generate new jobs manifest
        if: always()
        run: python scripts/generate_new_jobs.py

      - name: Generate companies page
        if: always()
        run: python scripts/generate_companies_page.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ state/ docs/new_jobs.json docs/index.html docs/companies.json docs/companies.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🦀 crawl: $(date -u +%Y-%m-%d)"
            git push
          fi