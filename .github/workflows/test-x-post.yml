name: TEMP Test X Post

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-x-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Post a test tweet
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          import post_social
          ok = post_social._post_x('Testing X integration for openings.info \u2014 please ignore.')
          print('posted:', ok)
          "
